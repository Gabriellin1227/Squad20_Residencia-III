<!doctype html>
<html lang="pt-BR">

    />
    <meta name="theme-color" content="#0B2545" />
    <title>Sem conexão — FrotaManager Motorista</title>
    <style>
      body {

        min-height: 44px;

        color: #fff;
        background: #1f5fad;
        border: 0;
        border-radius: 8px;
      }

    <main>
      <h1>Sem conexão</h1>
      <p>
        O app do motorista precisa de internet para acompanhar sua rota em tempo real.
